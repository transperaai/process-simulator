name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Supabase's Data API server, for the MCP end-to-end test
      # (packages/mcp/test/postgrest.test.ts). It keeps retrying until the test
      # creates its database and lets the authenticator role log in. The JWT
      # secret only signs test tokens for this throwaway container.
      postgrest:
        image: postgrest/postgrest:v14.18
        env:
          PGRST_DB_URI: postgres://authenticator:authenticator@postgres:5432/transpera_flow_postgrest
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: ci-only-postgrest-jwt-secret-for-throwaway-tests
        ports:
          - 3000:3000
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      POSTGREST_URL: http://localhost:3000
      POSTGREST_JWT_SECRET: ci-only-postgrest-jwt-secret-for-throwaway-tests
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser determinism test
        run: pnpm --filter @transpera-flow/engine exec playwright-core install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @transpera-flow/web build
