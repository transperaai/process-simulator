<title>Transpera Flow Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- PROTOTYPE, throwaway. Clickable flow for the Transpera Flow redesign. Sample data only; nothing is saved. -->
<style>
/* Layout: ops console. Sidebar nav, one screen at a time, map first, analysis underneath. Editor is its own full-screen mode. */
:root {
  --bg: #f3f4f2; --panel: #ffffff; --panel-2: #e9ebe7; --line: #d5d8d2; --line-2: #c2c6bf;
  --fg: #15181a; --fg-2: #4d5451; --fg-3: #5f6761;
  --accent: #1c5cab; --accent-soft: #dbe7f7; --accent-fg: #ffffff;
  --good: #1baf7a; --good-soft: #d8f3e8; --teal: #1f8a94; --teal-soft: #d5eef0;
  --warn: #eda100; --warn-soft: #fdf0d1; --crit: #e34948; --crit-soft: #fbe1e0;
  --edit: #6d3fc4; --edit-soft: #ece4fa; --edit-fg: #ffffff;
  --shadow: 0 1px 2px rgba(20,24,30,.06), 0 4px 14px rgba(20,24,30,.05);
  --shadow-overlay: 0 8px 24px rgba(20,24,30,.14), 0 2px 6px rgba(20,24,30,.06);
  --scrim: rgba(20,24,30,.38);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151716; --panel: #1e211f; --panel-2: #272b29; --line: #343936; --line-2: #454b47;
  --fg: #eceeea; --fg-2: #b5bbb6; --fg-3: #959c97;
  --accent: #5598e7; --accent-soft: #1f3350; --accent-fg: #0b1220;
  --good: #22b07e; --good-soft: #153f30; --teal: #3bb0b8; --teal-soft: #133a3d;
  --warn: #d99a0b; --warn-soft: #45360f; --crit: #e66767; --crit-soft: #4a2424;
  --edit: #a37ef0; --edit-soft: #2e2248; --edit-fg: #140a26;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-overlay: 0 8px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  --scrim: rgba(0,0,0,.55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151716; --panel: #1e211f; --panel-2: #272b29; --line: #343936; --line-2: #454b47;
  --fg: #eceeea; --fg-2: #b5bbb6; --fg-3: #959c97;
  --accent: #5598e7; --accent-soft: #1f3350; --accent-fg: #0b1220;
  --good: #22b07e; --good-soft: #153f30; --teal: #3bb0b8; --teal-soft: #133a3d;
  --warn: #d99a0b; --warn-soft: #45360f; --crit: #e66767; --crit-soft: #4a2424;
  --edit: #a37ef0; --edit-soft: #2e2248; --edit-fg: #140a26;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-overlay: 0 8px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  --scrim: rgba(0,0,0,.55); color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 14.5px; font-weight: 600; font-family: var(--f-sans); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }

/* Shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { border-right: 1px solid var(--line); padding: 16px 10px 24px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: conic-gradient(from 200deg, var(--accent), var(--teal), var(--edit), var(--accent)); flex: none; }
.brand .bname { font-family: var(--f-display); font-weight: 700; font-size: 16.5px; letter-spacing: -0.01em; white-space: nowrap; }
.ws { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.ws b { font-weight: 600; font-size: 13.5px; }
.wsav { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; flex: none; }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navlabel { padding: 16px 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; border: 0; background: none; color: var(--fg-2); font-size: 14px; }
.nav .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav:hover { background: var(--panel-2); color: var(--fg); }
.nav.on { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.nav.on .ico { color: var(--accent); }
.nav .cnt { margin-left: auto; font-family: var(--f-mono); font-size: 11px; background: var(--panel-2); border-radius: 99px; padding: 0 7px; font-weight: 500; color: var(--fg-2); }
.nav .cnt.warn { background: var(--warn-soft); color: var(--fg); }
.nav .cnt.ai { background: var(--edit-soft); color: var(--edit); }
.sidefoot { margin-top: auto; padding: 16px 10px 0; line-height: 1.4; }
.main { padding: 28px 36px 80px; min-width: 0; display: flex; flex-direction: column; gap: 36px; max-width: 1480px; width: 100%; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head .t { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-2); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--fg-2); }
.crumbs button:hover { color: var(--accent); text-decoration: underline; }
.crumbs span { color: var(--fg-3); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sechead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.sechead { align-items: flex-end; }
.sechead > div:not(.row) { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sechead p { color: var(--fg-2); font-size: 13px; max-width: 72ch; }
.sechead p b { color: var(--fg); font-family: var(--f-mono); font-weight: 500; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .side .navlabel, .side .ws, .side .sidefoot { display: none; }
  .navgroup { flex-direction: row; flex-wrap: wrap; }
  .nav { width: auto; }
  .main { padding: 20px 16px 64px; }
}

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.edit { background: var(--edit); border-color: var(--edit); color: var(--edit-fg); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 6px; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-family: var(--f-mono); color: var(--fg-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--fg-2); }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 6px 9px; color: var(--fg); font-size: 13.5px; width: 100%; }
.field textarea { min-height: 64px; resize: vertical; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; white-space: nowrap; }
.chip.btnchip { cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.chip .x { color: var(--fg-3); }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 600; background: var(--panel-2); border: 2px solid var(--panel); }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -6px; }

/* Rating spectrum */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: var(--ps); color: var(--fg); font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; }
.pill.plain { background: var(--panel-2); }
.verdict { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; padding: 1px 7px; border-radius: 4px; }
.verdict.pass { background: var(--good-soft); }
.verdict.fail { background: var(--crit-soft); }
.verdict.wait { background: var(--panel-2); color: var(--fg-2); }
.spectrum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.spectrum button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.spectrum button b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.spectrum button b i { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); }
.spectrum button.on { border-color: var(--pc); background: var(--ps); box-shadow: inset 0 0 0 1px var(--pc); }
@media (max-width: 600px) { .spectrum { grid-template-columns: 1fr 1fr; } }

/* Cards and KPIs */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .v.txt { font-size: 20px; line-height: 1.2; padding-block: 4px 3px; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--fg-2); }
.kpi .r { font-family: var(--f-mono); font-size: 11.5px; color: var(--fg-2); }
.kpi.focus { border-color: var(--crit); box-shadow: inset 3px 0 0 var(--crit); }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 980px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.principles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
.principles > div { padding: 12px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.principles > div:first-child { border-left: 0; }
@media (max-width: 980px) { .principles { grid-template-columns: 1fr 1fr; } .principles > div:nth-child(3) { border-left: 0; } .principles > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 560px) { .principles { grid-template-columns: 1fr; } .principles > div { border-left: 0; border-top: 1px solid var(--line); } .principles > div:first-child { border-top: 0; } }
.viewing { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 10px 3px 8px; border-radius: 99px; background: var(--good-soft); }
.viewing i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.viewing.old { background: var(--warn-soft); }
.viewing.old i { background: var(--warn); }

/* Map */
.mapwrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; display: flex; flex-direction: column; }
.maptools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.mapscroll { overflow: auto; padding: 4px; max-height: 640px; }
.mapwrap.tall .mapscroll { max-height: none; }
svg.map { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; background: var(--pc); }
.edge { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.arrow { fill: var(--line-2); }
.node { cursor: pointer; transition: opacity var(--m, 120ms); }
.node .nbox { fill: var(--panel); stroke: var(--line-2); stroke-width: 1; }
.node:hover .nbox { stroke: var(--fg-3); }
.node.dim { opacity: .4; }
.node.hl .nbox { stroke: var(--accent); stroke-width: 2.5; }
.node.reg .nbox { stroke: var(--crit); stroke-width: 2; stroke-dasharray: 5 3; }
.node.sel .nbox { stroke: var(--edit); stroke-width: 3; }
.node.added .nbox { stroke: var(--edit); stroke-dasharray: 5 3; fill: var(--edit-soft); }
.node.changed .nbox { stroke: var(--edit); }
.nname { font: 600 13px var(--f-sans); fill: var(--fg); }
.nrole { font: 400 11.5px var(--f-sans); fill: var(--fg-2); }
.node .stack2 { fill: var(--panel-2); }
.maptitle { font-size: 13px; font-weight: 600; margin-right: 4px; }
.seg.zoom button { font-family: var(--f-sans); padding: 3px 10px; font-size: 13px; }
.nsub { font: 400 11px var(--f-mono); fill: var(--fg-2); }
.nsub.up { fill: var(--good); font-weight: 500; }
.nsub.down { fill: var(--crit); font-weight: 500; }
.nsub.dl { fill: var(--edit); font-weight: 500; }
.nutil { font: 500 10.5px var(--f-mono); }
.tgl rect { fill: var(--accent-soft); stroke: none; }
.tgl:hover rect { fill: var(--accent); }
.tgl:hover text { fill: var(--accent-fg); }
.tgl text { font: 600 11px var(--f-sans); fill: var(--accent); }
.tgl { cursor: pointer; }
.gbox { fill: color-mix(in srgb, var(--bg) 70%, var(--panel)); stroke: var(--line-2); stroke-dasharray: 5 4; }
.group.hl .gbox { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: none; }
.group.reg .gbox { stroke: var(--crit); stroke-width: 2; }
.group.dim { opacity: .45; }
.group.changed .gbox { stroke: var(--edit); stroke-width: 2; fill: var(--edit-soft); }
.group.sel .gbox { stroke: var(--edit); stroke-width: 3; stroke-dasharray: none; }
.ghead { font: 600 13.5px var(--f-sans); fill: var(--fg); }
.gsub { font: 400 11px var(--f-mono); fill: var(--fg-2); }
.badge circle { fill: var(--crit); }
.badge text { font: 600 10.5px var(--f-mono); fill: var(--panel); }

/* First principles flow */
.fp { display: grid; grid-template-columns: 230px minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1200px) { .fp { grid-template-columns: 200px minmax(0, 1fr); } .fpai { grid-column: 1 / -1; } }
@media (max-width: 760px) { .fp { grid-template-columns: 1fr; } }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; }
.stepper button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--fg-2); }
.stepper button:hover { background: var(--panel-2); }
.stepper button.on { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.stepper .sn { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; flex: none; background: var(--panel); }
.stepper .done .sn { background: var(--good); border-color: var(--good); color: var(--panel); }
.stepper .on .sn { border-color: var(--accent); }
.stepper .sn.fl, .stepper .done .sn.fl { background: var(--warn); border-color: var(--warn); color: var(--fg); }
.rcards { display: flex; flex-direction: column; gap: 10px; }
.rcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.rtop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rtop > .inp { flex: 1 1 260px; font-weight: 500; }
.rgrid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 10px; }
@media (max-width: 700px) { .rgrid { grid-template-columns: 1fr; } }
.stepper .sl { flex: 1; font-size: 13.5px; }
.stepper .sf { font-family: var(--f-mono); font-size: 11px; background: var(--warn-soft); border-radius: 99px; padding: 0 7px; color: var(--fg); }
.fpmain { display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; }
.fpmain h2 { font-size: 22px; }
.fpq { font-size: 15px; max-width: 70ch; }
.fpbody { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.fpbody table td { vertical-align: top; }
.fpbody > .btn, .fpbody .stack > .btn { align-self: flex-start; }
.fpnav { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 10px; }
.inp.missing { border-color: var(--warn); background: var(--warn-soft); }
.fpai { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 16px; }
.flags { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.flag { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13px; background: var(--fs); border-radius: 8px; padding: 8px 10px; }
.flag .fi { width: 20px; height: 20px; border-radius: 50%; background: var(--fc); color: var(--panel); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; font-family: var(--f-mono); }
.fpall { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.fprow { display: flex; justify-content: space-between; border: 0; background: none; padding: 4px 2px; font-size: 13px; text-align: left; color: var(--fg); }
.fprow:hover { color: var(--accent); }
.warnc { color: var(--warn); font-weight: 600; }
:root[data-theme="dark"] .warnc { color: var(--warn); }
.delc { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.delc.back { background: var(--panel-2); }
.simres { background: var(--accent-soft); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .lanes { grid-template-columns: 1fr; } }
.lane { background: var(--bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.lcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 3px; }
.whys { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; }
.whys li { display: flex; flex-direction: column; gap: 4px; }
.whys li.root .inp { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.fp2 .mrow { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.principles.fp2 { grid-template-columns: 1.3fr 1.2fr 1fr; }
@media (max-width: 980px) { .principles.fp2 { grid-template-columns: 1fr; } .principles.fp2 > div { border-left: 0; border-top: 1px solid var(--line); } }

/* Lists */

/* Charts */

.chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }

/* Settings */

.drv { display: grid; grid-template-columns: 28px minmax(0, 1.6fr) 130px minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }

.mk { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }

.factor { display: grid; grid-template-columns: minmax(220px, 1.2fr) minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 6px 0; }

@media (max-width: 600px) { .factor { grid-template-columns: 1fr 64px; } .factor input { grid-column: 1 / -1; } }
.timeline { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
.timeline div { height: 34px; border-radius: 3px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px; color: var(--fg); }
.tlscale { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; font-family: var(--f-mono); font-size: 10px; color: var(--fg-3); }

/* Editor mode: its own screen, own colour, no sidebar */
.ed { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; }
.edbar { background: var(--edit); color: var(--edit-fg); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.edbar .mode { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
.edbar h1 { font-size: 17px; }
.edbar .btn { border-color: color-mix(in srgb, var(--edit-fg) 50%, transparent); background: transparent; color: var(--edit-fg); }
.edbar .btn.solid { background: var(--edit-fg); color: var(--edit); border-color: var(--edit-fg); }

.edhint { background: var(--edit-soft); padding: 6px 16px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.edbody { display: grid; grid-template-columns: 264px minmax(0, 1fr) 300px; min-height: 0; }
.edcol { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }

.edcanvas { overflow: auto; min-width: 0; background-color: var(--bg); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; padding: 12px; }
.edcanvas .mapwrap { background: transparent; border: 0; }
.edcanvas .maptools { border: 0; padding: 0 0 8px; }
.edcanvas .mapscroll { max-height: none; }
.pal { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pal button { border: 1px dashed var(--line-2); background: var(--bg); border-radius: 6px; padding: 8px 6px; font-size: 12.5px; }
.pal button:hover { border-color: var(--edit); }
.blk { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.blk .row { justify-content: space-between; flex-wrap: nowrap; }
.blk .btns { display: flex; gap: 6px; }
.edfoot { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.delta { display: flex; flex-direction: column; gap: 1px; padding-right: 20px; border-right: 1px solid var(--line); }
.delta:last-of-type { border-right: 0; }

@media (max-width: 1000px) { .ed { height: auto; min-height: 100vh; } .edbody { grid-template-columns: 1fr; } .edcol.l, .edcol.r { border: 0; border-bottom: 1px solid var(--line); } }

/* Modal and toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow-overlay); width: min(680px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; display: flex; flex-direction: column; }
.modal.wide { width: min(860px, 100%); }
.mhead { padding: 18px 20px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--line); }
.mbody { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.mfoot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--panel); }
.close { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--fg-2); padding: 2px 6px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-overlay); z-index: 60; max-width: calc(100% - 32px); }
.err { color: var(--crit); font-size: 12.5px; }

}
function place(c, cols, x0, y0, H) {
  const m = measCols(c, cols); H = H ?? m.h; let x = x0; const colBoxes = [];

        ${op ? `<tr class="mapcard"><td colspan="8"><div class="pcard">${PRIN[id] || FP[id] ? `<p class="small muted">Goal: ${esc(FP[id]?.job.progress || PRIN[id].goal)}</p>` : ""}${mapBlock("pv-" + id, { root: id, issues: true, legend: false, flat: true, title: esc(nd.name) })}</div></td></tr>` : ""}`; }).join("")}
    </tbody></table></div>`;
  },
  process() {
    const pid = S.p, nd = BASE[pid], key = "pr-" + pid, pr = PRIN[pid], vers = VERSIONS[pid] || VERSIONS.sales;

    return `<header class="head"><div class="t"><nav class="crumbs" aria-label="Breadcrumb">${crumbs}</nav>
        <h1 class="h1switch">${switcher(pid)}</h1>

    ${principlesCard(pid)}
    <section><div class="sechead"><h2>Projection</h2>${horizonSeg()}</div><div class="kpis">${kpisFor(pid)}</div></section>
    <section><div class="sechead"><div><h2>Map</h2><p>Coloured by rating. Red badges are confirmed issues. Click a step for detail.</p></div></div>
      ${mapBlock(key, { root: pid, issues: true })}</section>
    ${insightSection(pid, key)}
    <section><div class="sechead"><div><h2>Issues</h2><p>Open issues linked to this process or its steps.${issuesFor(pid, true).length - iss.length ? ` <button class="link" data-act="seeresolved">${issuesFor(pid, true).length - iss.length} resolved →</button>` : ""}</p></div><button class="btn" data-act="newissue" data-p="${pid}">+ New issue</button></div>${issueTable(iss)}</section>
    <section><div class="sechead"><div><h2>Solutions</h2><p>Bundles of steps tested against an issue. They never change the live map.</p></div></div>${solCards(sols)}</section>

    <div class="grid2">
      <div class="card chartcard"><h3>Wait before each step</h3>${hbars(Object.values(BASE).filter(x => !x.cols && x.w != null && desc(BASE, pid).has(x.id)).sort((a, b) => b.w - a.w).slice(0, 7).map(x => ({ label: x.name, v: x.w })), { max: 50, th: 16, fmt: fmtH, thLabel: "16 h rule", color: v => v >= 40 ? "var(--crit)" : v >= 16 ? "var(--warn)" : "var(--accent)" })}</div>
      <div class="card chartcard"><h3>How busy each role is</h3>${hbars(ROLEU)}</div>
    </div></section>`;
  },
  principles() {
    const pid = S.p, f = FP[pid] || (FP[pid] = fpTemplate()), i = S.fpStep || 0, st = FP_STEPS[i], flags = fpFlags(f);
    const done = FP_STEPS.filter(x => fpDone(f, x.k)).length;
    const nflag = k => flags[k].filter(x => x[0] === "bad" || x[0] === "warn").length;
    return `<header class="head"><div class="t"><nav class="crumbs"><button data-go="processes">Processes</button><span>/</span><button data-go="process:${pid}">${esc(pname(pid))}</button><span>/</span><span>First principles</span></nav>
      <h1>First principles · ${esc(pname(pid))}</h1><p class="muted">Strip the process back to what's actually true, then rebuild it. Seven steps; AI checks every answer against the simulation.</p></div>
      <div class="row"><span class="small muted">${done} of 7 steps filled in · ${FP_STEPS.reduce((a, x) => a + nflag(x.k), 0)} AI flags</span><div class="bar" style="width:120px"><i style="width:${done / 7 * 100}%"></i></div><button class="btn" data-go="process:${pid}">Back to ${esc(pname(pid))}</button></div></header>
    <div class="fp">
      <ol class="stepper">${FP_STEPS.map((x, j) => `<li><button class="${j === i ? "on" : ""} ${fpDone(f, x.k) ? "done" : ""}" data-act="fpstep" data-i="${j}"><span class="sn ${nflag(x.k) ? "fl" : ""}">${nflag(x.k) ? nflag(x.k) : fpDone(f, x.k) ? "✓" : j + 1}</span><span class="sl">${x.n}</span></button></li>`).join("")}</ol>
      <section class="card fpmain"><span class="eyebrow">Step ${i + 1} of 7</span><h2>${st.n}</h2><p class="fpq">${st.q}</p><span class="small muted">Method: ${st.from}</span>
        <div class="fpbody">${fpBody(pid, f, st.k)}</div>
        <div class="spread fpnav"><button class="btn" data-act="fpstep" data-i="${i - 1}" ${i === 0 ? "disabled" : ""}>← ${i ? FP_STEPS[i - 1].n : ""}</button>${i < 6 ? `<button class="btn primary" data-act="fpstep" data-i="${i + 1}">${FP_STEPS[i + 1].n} →</button>` : `<button class="btn primary" data-go="process:${pid}">Done</button>`}</div></section>

        <div class="fpall"><span class="eyebrow">All steps</span>${FP_STEPS.map((x, j) => `<button class="fprow" data-act="fpstep" data-i="${j}"><span>${x.n}</span><span class="num small ${nflag(x.k) ? "warnc" : "muted"}">${nflag(x.k) ? nflag(x.k) + " to fix" : "✓"}</span></button>`).join("")}</div></aside>

  solutions() {
    const ideas = SUG.filter(g => g.kind === "Solution idea");
    return `<header class="head"><div class="t"><span class="eyebrow">Improve</span><h1>Solutions</h1><p class="muted">Every solution that has been built and simulated. Each one says which issues it solves, and how it did against each issue's target.</p></div><button class="btn edit" data-act="newsol">✎ New solution</button></header>
    ${ideas.length ? `<div class="ideabar">${ico("suggestions")}<span><b>${ideas.length} AI idea${ideas.length > 1 ? "s" : ""}</b> not built yet. Ideas live in Suggestions until someone builds them; then they become solutions here.</span><button class="btn sm" data-go="suggestions">See ideas →</button></div>` : ""}
    ${solCards(SOL)}`;

  issues() {
    const f = S.ratingFilter.issues, v = S.issueView || "open";

    return `<header class="head"><div class="t"><span class="eyebrow">Improve</span><h1>Issues</h1><p class="muted">Problems you've confirmed, linked to a whole process or to specific steps. Resolved issues stay here with their full history.</p></div><button class="btn primary" data-act="newissue" data-p="company">+ New issue</button></header>
      <div class="spread"><div class="seg" role="group" aria-label="Show">${[["open", "Open"], ["resolved", "Resolved"], ["all", "All"]].map(([k, l]) => `<button class="${v === k ? "on" : ""}" data-act="issueview" data-v="${k}">${l} ${n(k)}</button>`).join("")}</div>${ratingFilters("issues", base)}</div>
      ${issueTable(list)}`;

    <div class="side2"><div class="stack">
      ${mapBlock("is-" + i.id, { root: i.proc, hl: i.nodes, defaultOpen: openGroups, title: "Where this issue sits", legend: false })}

      <section><div class="sechead"><div><h2>Solutions tested</h2><p>Each solution lives on its own. Here is how each one did against this issue's target.</p></div></div>
        ${ss.length ? `<div class="tblwrap"><table><thead><tr><th>Solution</th><th>Type</th><th>Built</th><th>Automatic</th><th class="n">Holds in</th><th>Yours</th></tr></thead><tbody>${ss.map(s => { const f = forOf(s, i.id); return `<tr class="click" data-go="compare:${s.id}"><td><b>${esc(s.name)}</b>${s.for.length > 1 ? `<div class="small muted">Also solves ${s.for.filter(x => x.issue !== i.id).map(x => "#" + x.issue).join(", ")}</div>` : ""}</td><td><span class="kind ${s.type === "AI block" ? "ai" : ""}">${esc(s.type)}</span></td><td class="small nowrap">${s.date}</td><td>${verdict(f.auto)}</td><td class="n">${f.robust ? f.robust + "%" : "—"}</td><td>${verdict(f.yours)}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">Nothing tested yet. Build solution opens the Editor with this issue's steps outlined.</div>`}
      </section>
      ${ideas.length ? `<section><div class="sechead"><div><h2>AI ideas</h2><p>Proposed by AI, not built or simulated yet.</p></div></div>${ideas.map(ideaCard).join("")}</section>` : ""}
      <section><div class="sechead"><div><h2>History</h2><p>Everything that happened to this issue, oldest first. Kept after it's resolved.</p></div></div>
        <ol class="timeline2">${(i.log || []).map(([d, who, t]) => `<li><span class="when">${d}</span><span class="who">${esc(who)}</span><span>${esc(t)}</span></li>`).join("")}</ol></section>
    </div>
      <div class="stack">
        <div class="card stack"><span class="eyebrow">Target</span><b>${esc(i.target.label)}</b><div class="row">${i.target.was ? `<span class="small muted">Was</span><span class="num">${esc(i.target.was)}</span>` : ""}<span class="small muted">Now</span><span class="num">${esc(i.target.now)}</span><span class="small muted">Goal</span><span class="num">${esc(i.target.goal)}</span></div><span class="small muted">Solutions get an automatic pass or fail against this. You make the final call.</span></div>
        <div class="card stack"><span class="eyebrow">Owners</span><div class="checks">${i.owners.map(o => `<span class="chip"><span class="avatar" style="width:20px;height:20px">${initials(o)}</span>${esc(person(o).name)}</span>`).join("")}</div></div>
        <div class="card stack"><span class="eyebrow">Linked to</span><div class="checks"><span class="chip">Process: ${esc(pname(i.proc))}</span>${i.nodes.map(x => `<span class="chip">Step: ${esc(nodeName(x))}</span>`).join("")}</div></div>

      </div></div>`;
  },
  compare() {
    const s = SOL.find(x => x.id === S.p), groups = [...new Set(Object.keys(s.replace).flatMap(g => [...ancestors(g), g]).filter(g => g !== s.proc && desc(BASE, s.proc).has(g)))];
    const okey = "cmp-" + s.id;
    return `<header class="head"><div class="t"><nav class="crumbs"><button data-go="solutions">Solutions</button><span>/</span><span>${esc(s.name)}</span></nav>

      ${s.for.length ? `<div class="solgrid">${s.for.map(f => { const i = ISS.find(x => x.id === f.issue); return `<div class="card stack">

    <div class="side2"><div class="stack">
      <div class="tblwrap"><table><thead><tr><th>Measure</th><th class="n">Live</th><th class="n">Solution</th><th>Change</th></tr></thead><tbody>${s.rows.map(r => `<tr><td>${esc(r[0])}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td class="${r[3] ? "up" : "down"}">${r[3] ? "Better" : "Worse"}</td></tr>`).join("")}</tbody></table></div>
      <div class="card chartcard"><div class="spread"><h3>MRR over ${S.h} months</h3><div class="legend"><span style="--pc:var(--accent)"><i></i>Live</span><span style="--pc:var(--edit)"><i></i>With solution</span></div></div>${lineBand(mrrSeries(S.h), v => "A$" + Math.round(v / 1000) + "k", xlab(S.h), mrrSeries(S.h, s.for.some(f => f.auto === "pass") ? 1 : .2))}</div>

        <div class="tblwrap"><table><thead><tr><th>Market</th><th>Result</th><th>Key number</th></tr></thead><tbody>${s.stress.map(r => `<tr><td>${r[0]}</td><td>${verdict(r[1])}</td><td class="mono small">${r[2]}</td></tr>`).join("")}</tbody></table></div></section>

    </div></div>`;

  history() {
    const pid = S.p, vs = VERSIONS[pid] || VERSIONS.sales;

  },
  people() {

    <div class="grid3">

  edreplace(d) { const e = S.ed; if (!e.sel) { toast("Select a step or group on the canvas first."); return; } const { cols, defs } = addBlockDefs(e, d.b); Object.assign(e.tree, defs); Object.keys(defs).forEach(k => e.tree[k].parent = e.sel); const nd = e.tree[e.sel]; nd.cols = cols; nd.changed = true; delete nd.sub; S.open.ed.add(e.sel); e.replaced[e.sel] = d.b; e.sim = null; if (!e.name) e.name = BLK[d.b].name; renderEditorKeepScroll(); toast(`Replaced ${nd.name} with ${BLK[d.b].name}.`); },
  edinsert(d) { const e = S.ed, t = e.tree, gid = "grp" + (++e.n); const { cols, defs } = addBlockDefs(e, d.b); Object.assign(t, defs); Object.keys(defs).forEach(k => t[k].parent = gid); t[gid] = { id: gid, name: BLK[d.b].name, cols, added: true }; if (e.sel && t[t[e.sel].parent]) { const c = colOf(t, e.sel); t[gid].parent = c.p; c.cols.splice(c.ci + 1, 0, [gid]); } else { t[gid].parent = e.root; t[e.root].cols.push([gid]); } S.open.ed.add(gid); e.replaced[gid] = d.b; e.sel = gid; e.sim = null; renderEditorKeepScroll(); },
  edsim() { S.ed.sim = simFor(S.ed); renderEditorKeepScroll(); toast("Simulated 30 times against live."); },

  edsaveblk() { const e = S.ed, name = ($("#ed-name")?.value || "").trim(); if (!name) { toast("Name the block first (top bar)."); return; } const id = "blk_" + Date.now(); const defs = {}; for (const k of desc(e.tree, e.root)) if (k !== e.root && !e.tree[k].cols) { const { id: _, parent, added, ...rest } = e.tree[k]; defs[k] = rest; } BLK[id] = { name, type: "Manual", desc: "Saved from the Editor.", cols: clone(e.tree[e.root].cols.filter(c => c.every(x => defs[x]))), defs }; S.ed = null; delete MAPS.ed; go("library"); toast("Block saved to the library."); },
  edsaveselblk() { const e = S.ed, g = e.tree[e.sel]; const defs = {}; for (const k of desc(e.tree, e.sel)) if (k !== e.sel && !e.tree[k].cols) { const { id: _, parent, added, ...rest } = e.tree[k]; defs[k] = rest; } BLK["blk_" + Date.now()] = { name: g.name, type: "Manual", desc: "Saved from the Editor.", cols: clone(g.cols.map(c => c.filter(x => defs[x])).filter(c => c.length)), defs }; toast(`Saved “${g.name}” to the block library.`); renderEditorKeepScroll(); },
  verdict(d) { const s = SOL.find(x => x.id === d.id), f = forOf(s, +d.i); f.yours = f.yours === d.v ? null : d.v; if (f.yours) logIssue(+d.i, `Marked “${s.name}” as ${f.yours}.`); const y = window.scrollY; render(); window.scrollTo(0, y); toast(f.yours ? `Marked ${f.yours} for #${d.i}. Logged in the issue's history.` : "Verdict cleared."); },
  seeresolved() { S.issueView = "resolved"; go("issues"); },
  ruleedit(d) { ruleModal(d.id); },

  rulesreset() { RULES.forEach(r => { r.v = r.cuts.map(c => c[1]); r.on = true; }); Object.assign(RULESET, { p90: true, bottleneck: true, capMonths: 12, absenceWeeks: 2, absencesYear: 2, waitPipeline: 8, waitServicing: 16 }); keepY(); toast("All rules reset to the agreed defaults."); },
  ruleovadd(d) { const r = RULES.find(x => x.id === d.id); r.overrides.push({ target: $("#ov-target").value, v: [...r.v], why: "" }); keepY(); ruleModal(d.id); toast("Override added. Edit its numbers by changing the cut-offs, then add again."); },

  fpadddel() { FP[S.p].del.push({ step: "a_site", breaks: "", agree: "austin", sim: { done: false } }); keepY(); },
  fpaddlane(d) { FP[S.p].saa[d.l].push({ t: "New change", steps: ["q_enrich"] }); keepY(); toast("Added. It touches Enrich in CRM, so the AI checks the order."); },
  fpaddwhy() { FP[S.p].why.chain.push(""); keepY(); },
  fpsimdel(d) { const x = FP[S.p].del[+d.i]; x.sim = { done: true, text: `Without ${nodeName(x.step)}: proposal turnaround 3.1 d → 2.8 d; win rate 31% → 30% (within range).` }; keepY(); toast("Simulated 30 runs without that step."); },
  proctoggle(d) { const o = S.procOpen || (S.procOpen = new Set()); o.has(d.p) ? o.delete(d.p) : o.add(d.p); keepY(); },
  issueview(d) { S.issueView = d.v; render(); },
  buildidea(d) { const g = SUG.find(x => x.id === d.id); const i = ISS.find(x => x.id === g.issue); const t = treeWith({ [g.target]: g.block }); startEditor({ mode: "solution", root: procOf(g.target), issue: i.id, tree: t, replaced: { [g.target]: g.block }, open: [...ancestors(g.target).filter(a => a !== "company" && a !== procOf(g.target)), g.target], name: g.title, idea: g.id }); toast("The AI's steps are placed. Adjust them, simulate, then save."); },
  newsol() { modal(`${mhead("New solution", `<span class="small muted">Pick the process it changes. You can link issues after.</span>`)}<div class="mbody"><div class="stack" style="gap:4px">${procList().filter(([id]) => id !== "company").map(([id, dd]) => `<button class="nav" style="padding-left:${dd * 14}px" data-act="newsolgo" data-p="${id}"><span class="cdot" style="background:${RT[BASE[id].rating].c}"></span>${esc(BASE[id].name)}</button>`).join("")}</div></div>`); },
  newsolgo(d) { startEditor({ mode: "solution", root: d.p, name: "" }); },
  linkissue(d) { const s = SOL.find(x => x.id === d.id); const opts = ISS.filter(i => isOpenIssue(i) && !forOf(s, i.id)); modal(`${mhead("Link an issue", `<span class="small muted">${esc(s.name)} will be judged against that issue's target.</span>`)}<div class="mbody">${opts.length ? `<div class="stack" style="gap:6px">${opts.map(i => `<button class="nav" data-act="linkissuego" data-id="${s.id}" data-i="${i.id}">${pill(i.rating)}<span>#${i.id} ${esc(i.title)}</span></button>`).join("")}</div>` : `<p class="muted">Every open issue is already linked.</p>`}</div>`); },
  linkissuego(d) { const s = SOL.find(x => x.id === d.id), i = ISS.find(x => x.id === +d.i); s.for.push({ issue: i.id, auto: "pass", autoText: `Checked against “${i.target.label} ${i.target.goal}” (sample result).`, robust: 72, yours: null }); logIssue(i.id, `Linked solution “${s.name}”. Automatic verdict: pass, holds in 72%.`); if (i.status === "Open") i.status = "Testing solutions"; closeModal(); render(); toast(`Linked to #${i.id}.`); },
  resolve(d) { resolveModal(+d.id, "solution"); },
  resolvehow(d) { const n = $("#rs-note")?.value; resolveModal(+d.id, d.h); if (n) $("#rs-note").value = n; },
  resolvesave(d) {
    const i = ISS.find(x => x.id === +d.id), how = d.h, note = $("#rs-note").value.trim(), sol = $("#rs-sol")?.value;

    logIssue(i.id, how === "solution" ? `Resolved by solution “${SOL.find(x => x.id === sol).name}”.${note ? " " + note : ""}` : how === "process" ? `Resolved by changing the process directly.${note ? " " + note : ""}` : `Resolved: no longer a problem.${note ? " " + note : ""}`);

  },
  reopen(d) { const i = ISS.find(x => x.id === +d.id); i.status = "Open"; delete i.resolved; logIssue(i.id, "Reopened."); render(); toast(`Issue #${i.id} reopened.`); },
  viewver(d) { S.viewVersion = { p: d.p, v: +d.v }; go("process", d.p); },

  restore(d) { toast(`Version ${d.v} restored as a new draft. Open the Editor to review and publish it.`); },
  dup(d) { toast(`Version ${d.v} duplicated as a new process: “Sales (copy)”.`); },
  addsource(d) { sourceModal({ k: d.k, id: d.id, src: d.src }); },
  srck(d) { const pre = { ...sourceModal.pre, k: d.k, id: null }; const keep = ["src-title", "src-quote", "src-date"].map(i => $("#" + i)?.value); sourceModal(pre); ["src-title", "src-quote", "src-date"].forEach((i, j) => { if ($("#" + i) && keep[j] != null) $("#" + i).value = keep[j]; }); },
  srcsave(d) {

  mkdup() { const id = "c" + Date.now(); MARKETS[id] = { name: MARKETS[S.mk].name + " (custom)", preset: false, v: { ...MARKETS[S.mk].v } }; MCOL[id] = "var(--accent-soft)"; S.mk = id; render(); },

function setPath(o, path, v) { const ks = path.split("."); let t = o; ks.slice(0, -1).forEach(k => t = t[k]); t[ks.at(-1)] = v; }

function keepAck() { if (!ACK) return; const t = $("#ack-title"); if (t) ACK.title = t.value; const l = $("#ack-tl"), g = $("#ack-tg"); if (l) ACK.target = { ...ACK.target, label: l.value, goal: g.value }; }

document.addEventListener("input", e => {
  const cut = e.target.closest("[data-cut]"); if (cut) { const r = RULES.find(x => x.id === cut.dataset.id); r.v[+cut.dataset.cut] = +cut.value; const order = ["great", "good", "bad", "risk"]; const pv = $("#bandprev"); if (pv) pv.innerHTML = r.show(r.v).map((v, j) => `<div style="--pc:${RT[order[j]].c};--ps:${RT[order[j]].s}"><b>${RT[order[j]].l}</b><span>${esc(v || "—")}</span></div>`).join(""); return; }
  const rs = e.target.closest("[data-rs]"); if (rs) { RULESET[rs.dataset.rs] = +rs.value; return; }

  if (d.act === "drvname") DRV.find(x => x.id === d.id).name = a.value;
  if (d.act === "drvdesc") DRV.find(x => x.id === d.id).desc = a.value;
  if (d.act === "drvex") DRV.find(x => x.id === d.id).ex = a.value;
  if (d.act === "mkv") { MARKETS[S.mk].v[d.f] = +a.value; $("#mkv-" + d.f).textContent = a.value + "%"; }
  if (d.act === "mkname") MARKETS[S.mk].name = a.value;
  if (d.act === "vnote") SOL.find(x => x.id === d.id).note = a.value;
  if (d.act === "edname") S.ed.name = a.value;
  if (d.act === "edf") { const nd = S.ed.tree[S.ed.sel]; const f = d.f; nd[f] = f === "h" || f === "w" ? +a.value : a.value; if (!nd.added) nd.changed = true; delete nd.sub; S.ed.sim = null; MAPS.ed.sel = S.ed.sel; refreshMap("ed"); }
});
document.addEventListener("change", e => {
  const fpEl = e.target.closest("[data-fp]"); if (fpEl && FP[S.p]) { setPath(FP[S.p], fpEl.dataset.fp, fpEl.value); keepY(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return; const d = a.dataset;
  if (d.act === "drvon") { DRV.find(x => x.id === d.id).on = a.checked; const y = window.scrollY; render(); window.scrollTo(0, y); }
  if (d.act === "ackscope") { keepAck(); ACK.scope = a.value; ackModal(ACK); }
  if (d.act === "mkname" || d.act === "drvname") { const y = window.scrollY; render(); window.scrollTo(0, y); }
});
function showTip(el) {
  const h = HELP[el.dataset.tip]; if (!h) return; const t = $("#tip");
  t.innerHTML = `<span>${esc(h[0])}</span><span class="tex"><b>Example</b>${esc(h[1])}</span>`; t.hidden = false;
  const r = el.getBoundingClientRect(), w = t.offsetWidth, hh = t.offsetHeight;
  let x = Math.min(window.innerWidth - w - 12, Math.max(12, r.left + r.width / 2 - w / 2)), y = r.bottom + 8;
  if (y + hh > window.innerHeight - 8) y = r.top - hh - 8;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function hideTip() { const t = $("#tip"); if (t) t.hidden = true; document.querySelectorAll(".info.on").forEach(x => x.classList.remove("on")); }
document.addEventListener("mouseover", e => { const i = e.target.closest?.(".info"); if (i) showTip(i); });
document.addEventListener("mouseout", e => { if (e.target.closest?.(".info") && !e.target.closest(".info").classList.contains("on")) hideTip(); });
document.addEventListener("focusin", e => { const i = e.target.closest?.(".info"); if (i) showTip(i); });
document.addEventListener("focusout", e => { if (e.target.closest?.(".info")) hideTip(); });
document.addEventListener("click", e => { const i = e.target.closest(".info"); if (i) { e.stopPropagation(); e.preventDefault(); const on = !i.classList.contains("on"); hideTip(); if (on) { i.classList.add("on"); showTip(i); } } else hideTip(); }, true);
window.addEventListener("scroll", hideTip, true);
let hoverRow = null;
document.addEventListener("mouseover", e => {
  const r = e.target.closest(".irow[data-hl]"); if (r === hoverRow) return; hoverRow = r;
  if (r) hl(r.dataset.map, r.dataset.hl.split(","));
});
document.addEventListener("mouseout", e => {
  const r = e.target.closest(".irow[data-hl]"); if (!r) return;

});
document.addEventListener("focusin", e => { const r = e.target.closest?.(".irow[data-hl]"); if (r) hl(r.dataset.map, r.dataset.hl.split(",")); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && e.target.matches?.(".irow, [data-node]")) e.target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
});

render();
