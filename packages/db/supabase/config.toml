# Supabase CLI project config. Run CLI commands with `--workdir packages/db`.
project_id = "flowsim"

[api]
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
