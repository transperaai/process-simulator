<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Northbeam Process Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ops-console. Canvas on the left carries the story; a tabbed control rail on the right does the work. KPIs read first. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --panel-2:#e9ebe7; --line:#d5d8d2; --line-2:#c2c6bf;
  --fg:#15181a; --fg-2:#4d5451; --fg-3:#7d857f;
  --accent:#1c5cab; --accent-soft:#dbe7f7; --accent-fg:#ffffff;
  --s1:#2a78d6; --s1-soft:#9ec5f4; --s2:#eb6834;
  --good:#1baf7a; --warn:#eda100; --serious:#eb6834; --crit:#e34948; --crit-soft:#fbe1e0; --warn-soft:#fdf0d1; --good-soft:#d8f3e8;
  --token:#2a78d6; --token-lost:#b1b6b0;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,24,30,.06),0 4px 14px rgba(20,24,30,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151716; --panel:#1e211f; --panel-2:#272b29; --line:#343936; --line-2:#454b47;
  --fg:#eceeea; --fg-2:#b5bbb6; --fg-3:#858c87;
  --accent:#5598e7; --accent-soft:#1f3350; --accent-fg:#0b1220;
  --s1:#3987e5; --s1-soft:#1c5cab; --s2:#d95926;
  --good:#199e70; --warn:#c98500; --serious:#d95926; --crit:#e66767; --crit-soft:#4a2424; --warn-soft:#45360f; --good-soft:#153f30;
  --token:#5598e7; --token-lost:#5a625d; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151716; --panel:#1e211f; --panel-2:#272b29; --line:#343936; --line-2:#454b47;
  --fg:#eceeea; --fg-2:#b5bbb6; --fg-3:#858c87;
  --accent:#5598e7; --accent-soft:#1f3350; --accent-fg:#0b1220;
  --s1:#3987e5; --s1-soft:#1c5cab; --s2:#d95926;
  --good:#199e70; --warn:#c98500; --serious:#d95926; --crit:#e66767; --crit-soft:#4a2424; --warn-soft:#45360f; --good-soft:#153f30;
  --token:#5598e7; --token-lost:#5a625d; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;padding-block:0 24px;padding-inline:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700;color:var(--fg-2)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);padding:6px 10px}
button:hover{border-color:var(--fg-3)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
button.ghost:hover{background:var(--panel-2)}
button.small{padding:3px 8px;font-size:12px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top .brand{display:flex;align-items:baseline;gap:10px}
.top .brand .ws{color:var(--fg-3);font-size:13px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-block:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .s{color:var(--fg-3);font-size:12px;margin-top:2px}
.kpi .d{font-family:var(--mono);font-size:12px;margin-top:4px}
.d.up{color:var(--good)} .d.down{color:var(--crit)} .d.flat{color:var(--fg-3)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .hd .spacer{flex:1}
.card .bd{padding:12px}

/* canvas */
.canvas-wrap{overflow-x:auto;overflow-y:hidden;background:
  radial-gradient(circle,var(--line) 1px,transparent 1px) 0 0/22px 22px, var(--panel)}
svg.canvas{display:block;min-width:760px;width:100%;height:auto;user-select:none;touch-action:none}
.node rect.box{fill:var(--panel);stroke:var(--line-2);stroke-width:1.2;rx:6}
.node:hover rect.box{stroke:var(--fg-3)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node rect.stripe{rx:2}
.node text{font-family:var(--body);fill:var(--fg)}
.node text.nm{font-weight:600;font-size:13px}
.node text.meta{font-size:11px;fill:var(--fg-2)}
.node text.wait{font-family:var(--mono);font-size:10.5px;fill:var(--fg-3)}
.node.bn rect.box{stroke:var(--crit);stroke-width:2;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
@media (prefers-reduced-motion:reduce){.node.bn rect.box{animation:none}}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.5}
.edge.lost{stroke-dasharray:4 4}
.elabel{font-family:var(--mono);font-size:10.5px;fill:var(--fg-3)}
.sink text{font-family:var(--display);font-weight:700;font-size:13px;fill:var(--fg)}
.sink rect{rx:16}
.sink.won rect{fill:var(--good-soft);stroke:var(--good)}
.sink.lost rect{fill:var(--panel-2);stroke:var(--line-2)}
.q circle{fill:var(--token);stroke:var(--panel);stroke-width:1}
.q text{font-family:var(--mono);font-size:10px;fill:var(--crit);font-weight:500}
.tok{fill:var(--token);stroke:var(--panel);stroke-width:1.2}
.tok.lost{fill:var(--token-lost)}
.svc rect{fill:var(--accent-soft)}
.role-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg-2)}
.role-legend span{display:inline-flex;align-items:center;gap:5px}
.role-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* playback */
.play{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.play input[type=range]{flex:1;min-width:140px}
.play .clock{font-family:var(--mono);font-size:12px;color:var(--fg-2);min-width:120px}

/* utilisation bars */
.util{display:grid;grid-template-columns:130px 1fr 52px;gap:6px 10px;align-items:center;font-size:13px}
.util .bar{height:14px;background:var(--panel-2);border-radius:3px;position:relative;overflow:hidden}
.util .bar i{position:absolute;top:0;bottom:0;left:0}
.util .bar .ong{background:var(--s1-soft)}
.util .bar .pipe{background:var(--s1)}
.util .bar .line{position:absolute;top:0;bottom:0;left:85%;width:2px;background:var(--crit);opacity:.7}
.util .pct{text-align:right;font-family:var(--mono);font-size:12px}
.util .pct.hot{color:var(--crit);font-weight:500}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}

/* rail */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:transparent;padding:10px 12px;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.pane{padding:12px}
.lever{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding-block:7px;border-bottom:1px dashed var(--line)}
.lever:last-child{border-bottom:0}
.lever label{font-size:13px}
.lever .val{font-family:var(--mono);font-size:12px;text-align:right;min-width:60px}
.lever input[type=range]{grid-column:1/-1;width:100%;margin:2px 0}
.lever.changed label{color:var(--accent);font-weight:600}
.group{margin-block:8px 14px}
.group h3{margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .spacer{flex:1}

/* compare */
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{text-align:left;font-weight:600;color:var(--fg-2);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.cmp td{padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp td.n{text-align:right;font-family:var(--mono);font-size:12px}
.cmp th.a{color:var(--s1)} .cmp th.b{color:var(--s2)}
.scn{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px}
.scn .t{font-weight:600}
.scn .d{color:var(--fg-2);font-size:12px;margin:2px 0 6px}
.headline{background:var(--panel-2);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.headline b{font-family:var(--display)}
.mini{display:grid;grid-template-columns:110px 1fr;gap:5px 8px;align-items:center;font-size:12px;margin-top:10px}
.mini .bars{display:grid;gap:2px}
.mini .bars i{display:block;height:7px;border-radius:2px}
.mini .bars i.a{background:var(--s1)} .mini .bars i.b{background:var(--s2)}

/* issues */
.issue{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 14px;margin-bottom:8px;position:relative;cursor:pointer}
.issue:hover{border-color:var(--fg-3)}
.issue.sel{border-color:var(--accent)}
.issue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:6px 0 0 6px;background:var(--fg-3)}
.issue.critical::before{background:var(--crit)} .issue.serious::before{background:var(--serious)} .issue.warning::before{background:var(--warn)} .issue.info::before{background:var(--s1)}
.issue .t{font-weight:600;font-size:13px}
.issue .e{color:var(--fg-2);font-size:12px;margin-top:3px}
.issue .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;background:var(--panel-2);color:var(--fg-2)}
.chip.auto{background:var(--accent-soft);color:var(--accent)}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.good{background:var(--good-soft);color:var(--good)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* inspector */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:block;font-size:11px;color:var(--fg-3);margin-bottom:2px}
.form input,.form select{width:100%;padding:5px 7px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
.form .full{grid-column:1/-1}

/* ai */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;margin-bottom:10px}
.msg{padding:8px 10px;border-radius:var(--r);font-size:13px;max-width:95%}
.msg.u{background:var(--accent-soft);align-self:flex-end}
.msg.a{background:var(--panel-2);align-self:flex-start}
.msg pre{font-family:var(--mono);font-size:11px;margin:6px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--fg-2)}
.chat-in{display:flex;gap:6px}
.chat-in input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{font-size:12px;color:var(--fg-3);margin-top:10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>Northbeam Digital</h1><span class="ws">Lead → live pipeline · Q4 baseline</span></div>
  <span class="pill"><span class="dot"></span>Prototype · sample data</span>
  <div class="spacer"></div>
  <button class="ghost small" id="btnReset">Reset to baseline</button>
</header>

<section class="kpis" id="kpis"></section>

<div class="main">
  <div class="left">
    <div class="card">
      <div class="hd">
        <h2>Process map</h2>
        <span class="eyebrow" id="repsNote">30 Monte Carlo runs · 13 weeks</span>
        <div class="spacer"></div>
        <div class="role-legend" id="roleLegend"></div>
      </div>
      <div class="canvas-wrap"><svg class="canvas" id="svg" viewBox="0 0 1060 420" role="img" aria-label="Process map with animated work items"></svg></div>
      <div class="play">
        <button id="btnPlay" class="small">▶ Play</button>
        <select id="speed" class="small"><option value="0.35">1×</option><option value="0.7" selected>2×</option><option value="1.6">4×</option></select>
        <input type="range" id="scrub" min="0" max="520" step="0.5" value="0" aria-label="Simulation time">
        <span class="clock" id="clock">Week 1 · Day 1</span>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="hd"><h2>Who is under water</h2><span class="eyebrow">Average utilisation over the quarter</span></div>
      <div class="bd">
        <div class="util" id="util"></div>
        <div class="legend"><span><i style="background:var(--s1)"></i>New-business pipeline</span><span><i style="background:var(--s1-soft)"></i>Ongoing client work</span><span><i style="background:var(--crit)"></i>85% ceiling: queues grow past here</span></div>
      </div>
    </div>
  </div>

  <aside class="card rail">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="levers">Levers</button>
      <button data-tab="compare">Compare</button>
      <button data-tab="issues">Issues</button>
      <button data-tab="step">Step</button>
      <button data-tab="ai">AI</button>
    </div>
    <div class="pane" id="pane-levers"></div>
    <div class="pane" id="pane-compare" hidden></div>
    <div class="pane" id="pane-issues" hidden></div>
    <div class="pane" id="pane-step" hidden></div>
    <div class="pane" id="pane-ai" hidden></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
// Discrete-event Monte Carlo engine for process maps. Time unit: working hours.
(function (root) {
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function randn(rng) { let u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function lognormal(rng, mean, cv) { if (mean <= 0) return 0; const s2 = Math.log(1 + cv * cv); const mu = Math.log(mean) - s2 / 2; return Math.exp(mu + Math.sqrt(s2) * randn(rng)); }
  function expo(rng, mean) { return -Math.log(1 - rng()) * mean; }

  // model: {horizonWeeks, hoursPerWeek, leadsPerWeek, activeClients, churnMonthly, retainer,
  //         roles:{id:{name,count,cost,ongoing}}, steps:[{id,name,role,work,wait,rework,next:[{to,p}]}], entry, sinks:{won,lost}}
  function runOnce(model, seed, keepTrace) {
    const rng = mulberry32(seed);
    const H = model.horizonWeeks * model.hoursPerWeek;
    const steps = {}; model.steps.forEach(s => steps[s.id] = s);
    const roles = {};
    for (const id in model.roles) { const r = model.roles[id]; roles[id] = { count: Math.max(1, r.count), busy: 0, busyHours: 0, queue: [] }; }
    const stepStat = {}; model.steps.forEach(s => stepStat[s.id] = { arrivals: 0, qLen: 0, qArea: 0, qLast: 0, qMax: 0, waitSum: 0, waitN: 0, reworks: 0, ongoing: s.role ? 0 : 0 });
    // per-step queues (FIFO), shared per role: pick oldest across steps of that role
    const stepQueue = {}; model.steps.forEach(s => stepQueue[s.id] = []);
    let active = model.activeClients;
    let events = []; // {t, type, e, step}
    let time = 0;
    const entities = []; let eid = 0;
    const cycle = []; let won = 0, lost = 0;
    const push = ev => { events.push(ev); };
    const pop = () => { let bi = 0; for (let i = 1; i < events.length; i++) if (events[i].t < events[bi].t) bi = i; const ev = events[bi]; events[bi] = events[events.length - 1]; events.pop(); return ev; };
    const availFrac = rid => { const r = model.roles[rid]; const ong = active * (r.ongoing || 0); const cap = roles[rid].count * model.hoursPerWeek; return Math.max(0.08, 1 - ong / cap); };
    const setQ = (sid, t, delta) => { const st = stepStat[sid]; st.qArea += st.qLen * (t - st.qLast); st.qLast = t; st.qLen += delta; if (st.qLen > st.qMax) st.qMax = st.qLen; };

    function enter(e, sid, t) {
      if (sid === model.sinks.won) { won++; cycle.push(t - e.t0); e.done = t; e.outcome = 'won'; active += 1; return; }
      if (sid === model.sinks.lost) { lost++; e.done = t; e.outcome = 'lost'; return; }
      const s = steps[sid]; const st = stepStat[sid]; st.arrivals++;
      const seg = { step: sid, tQ: t, tS: null, tE: null, tL: null };
      if (keepTrace) e.trace.push(seg); e.seg = seg;
      if (!s.role) { startService(e, s, t); return; }
      stepQueue[sid].push(e); setQ(sid, t, 1); tryStart(s.role, t);
    }
    function tryStart(rid, t) {
      const r = roles[rid];
      while (r.busy < r.count) {
        // oldest waiting entity across this role's steps
        let best = null, bestSid = null;
        for (const s of model.steps) if (s.role === rid && stepQueue[s.id].length) { const c = stepQueue[s.id][0]; if (!best || c.seg.tQ < best.seg.tQ) { best = c; bestSid = s.id; } }
        if (!best) break;
        stepQueue[bestSid].shift(); setQ(bestSid, t, -1);
        stepStat[bestSid].waitSum += t - best.seg.tQ; stepStat[bestSid].waitN++;
        r.busy++; startService(best, steps[bestSid], t);
      }
    }
    function startService(e, s, t) {
      e.seg.tS = t;
      let dur = 0;
      if (s.role) { dur = lognormal(rng, s.work, 0.35) / availFrac(s.role); roles[s.role].busyHours += dur * availFrac(s.role); }
      push({ t: t + dur, type: 'end', e, step: s.id });
    }
    function endService(e, s, t) {
      e.seg.tE = t;
      if (s.role) { roles[s.role].busy--; }
      const w = s.wait ? lognormal(rng, s.wait, 0.3) : 0;
      push({ t: t + w, type: 'leave', e, step: s.id });
      if (s.role) tryStart(s.role, t);
    }
    function leave(e, s, t) {
      e.seg.tL = t;
      if (s.rework && rng() < s.rework) { stepStat[s.id].reworks++; enter(e, s.id, t); return; }
      let u = rng(), acc = 0, to = s.next[s.next.length - 1].to;
      for (const n of s.next) { acc += n.p; if (u < acc) { to = n.to; break; } }
      enter(e, to, t);
    }
    // arrivals
    let ta = expo(rng, model.hoursPerWeek / model.leadsPerWeek);
    while (ta < H) { push({ t: ta, type: 'arrive' }); ta += expo(rng, model.hoursPerWeek / model.leadsPerWeek); }
    // weekly churn ticks
    for (let w = 1; w <= model.horizonWeeks; w++) push({ t: w * model.hoursPerWeek, type: 'week' });
    while (events.length) {

  // ---------- scenarios / compare ----------
  let saved = deep(SCENARIOS);
  function saveScenario() {
    const diffs = []; for (const l of LEVERS) { const v = getPath(model, l.path), b = getPath(baseline, l.path); if (Math.abs(v - b) > 1e-9) { diffs.push({ path: l.path, value: v }); if (l.link) diffs.push({ path: l.link, value: 1 - v }); } }
    if (!diffs.length) { toast('Nothing changed yet. Move a lever first.'); return; }
    const name = 'Scenario ' + String.fromCharCode(65 + saved.length);
    saved.push({ id: 'user-' + Date.now(), name, desc: diffs.filter(d => LEVERS.find(l => l.path === d.path)).map(d => { const l = LEVERS.find(l => l.path === d.path); return l.label + ' → ' + l.f(d.value); }).join(' · '), patch: diffs, user: true });
    toast(name + ' saved'); showTab('compare');
  }
  function renderCompare() {
    const a = resBase, b = res;
    const row = (label, va, vb, f, goodUp) => { const d = vb - va; const cls = Math.abs(d) < 1e-9 ? 'flat' : ((goodUp ? d > 0 : d < 0) ? 'up' : 'down'); return `<tr><td>${label}</td><td class="n">${f(va)}</td><td class="n">${f(vb)}</td><td class="n d ${cls}">${Math.abs(d) < 1e-9 ? '—' : (d > 0 ? '+' : '−') + f(Math.abs(d))}</td></tr>`; };
    const tbl = `<table class="cmp"><thead><tr><th>Metric</th><th class="a">Baseline</th><th class="b">${isBaseline() ? 'Current (= baseline)' : 'Current'}</th><th>Δ</th></tr></thead><tbody>

      ${row('Lead → live median (days)', days(a.cycleP50), days(b.cycleP50), v => fmt(v, 0), false)}
      ${row('Lead → live P90 (days)', days(a.cycleP90), days(b.cycleP90), v => fmt(v, 0), false)}
      ${row('Bottleneck utilisation', a.roles[a.bnRole].util * 100, b.roles[b.bnRole].util * 100, v => fmt(v) + '%', false)}
      ${row('Work stuck at quarter end', a.wipEnd, b.wipEnd, v => fmt(v, 0), false)}
      ${row('Labour cost per new client', a.costPerWin, b.costPerWin, money, false)}
      ${row('MRR added', a.mrrAdded, b.mrrAdded, money, true)}
      ${row('Annualised new revenue', a.mrrAdded * 12, b.mrrAdded * 12, money, true)}
    </tbody></table>`;
    const util = `<div class="mini"><div class="eyebrow" style="grid-column:1/-1;margin-top:6px">Utilisation by role · baseline vs current</div>` + Object.keys(model.roles).map(r => `<div>${model.roles[r].name}</div><div class="bars" title="${fmt(a.roles[r].util * 100)}% → ${fmt(b.roles[r].util * 100)}%"><i class="a" style="width:${Math.min(100, a.roles[r].util * 100)}%"></i><i class="b" style="width:${Math.min(100, b.roles[r].util * 100)}%"></i></div>`).join('') + `</div><div class="legend"><span><i style="background:var(--s1)"></i>Baseline</span><span><i style="background:var(--s2)"></i>Current</span></div>`;
    const list = `<h3 style="margin:16px 0 6px">Scenarios</h3>` + saved.map(s => `<div class="scn"><div class="t">${s.name}${s.user ? ' <span class="chip">yours</span>' : ''}</div><div class="d">${s.desc}</div><div class="row"><button class="small primary" data-apply="${s.id}">Apply</button><button class="small" data-stack="${s.id}">Stack on current</button></div></div>`).join('');
    $('pane-compare').innerHTML = `<div class="headline">${compareHeadline()}</div>` + tbl + util + list;
    $('pane-compare').querySelectorAll('[data-apply]').forEach(b => b.addEventListener('click', () => { const s = saved.find(x => x.id === b.dataset.apply); model = applyPatch(keepLayout(baseline), s.patch); recomputeNow(); toast('Applied: ' + s.name); }));
    $('pane-compare').querySelectorAll('[data-stack]').forEach(b => b.addEventListener('click', () => { const s = saved.find(x => x.id === b.dataset.stack); model = applyPatch(model, s.patch); recomputeNow(); toast('Stacked: ' + s.name); }));

  function keepLayout(m) { const c = deep(m); c.steps.forEach(s => { const cur = stepById(model, s.id); if (cur) { s.x = cur.x; s.y = cur.y; } }); return c; }
  function compareHeadline() {

  // ---------- issues ----------
  let issueFilter = 'all';
  function autoIssues() {
    const out = [];
    for (const rid in model.roles) { const u = res.roles[rid].util; if (u > .85) out.push({ id: 'auto-' + rid, step: res.bnStep && stepById(model, res.bnStep).role === rid ? res.bnStep : model.steps.find(s => s.role === rid)?.id, type: 'bottleneck', sev: u > .95 ? 'critical' : 'serious', title: `${model.roles[rid].name} at ${fmt(u * 100)}% utilisation`, evidence: `Simulated: ${fmt(res.roles[rid].ongoingHours)} h/wk ongoing + ${fmt(res.roles[rid].pipelineHours)} h/wk pipeline against ${model.roles[rid].count * 40} h capacity. Queues grow past 85%.`, owner: '—', status: 'detected', auto: true }); }
    for (const s of model.steps) { const st = res.steps[s.id]; if (st.avgWait > 16) out.push({ id: 'auto-q-' + s.id, step: s.id, type: 'delay', sev: st.avgWait > 40 ? 'critical' : 'warning', title: `Work waits ${fmt(days(st.avgWait), 1)} days at “${s.name}”`, evidence: `Simulated: average queue ${fmt(st.avgQueue, 1)} items, peak ${fmt(st.maxQueue)}. ${fmt(st.reworks)} items sent back for rework.`, owner: '—', status: 'detected', auto: true }); }
    const cnt = {}; for (const s of model.steps) if (s.role) cnt[s.role] = (cnt[s.role] || 0) + 1;
    for (const rid in model.roles) if (model.roles[rid].count === 1 && cnt[rid] && res.roles[rid].util > .5) out.push({ id: 'auto-spof-' + rid, step: model.steps.find(s => s.role === rid).id, type: 'spof', sev: 'serious', title: `${model.roles[rid].name} is one person carrying ${cnt[rid]} step${cnt[rid] > 1 ? 's' : ''}`, evidence: 'Structural: no cover if they are away. Detected from the map.', owner: '—', status: 'detected', auto: true });
    return out;
  }
  function renderIssues() {
    const all = autoIssues().concat(issues);

  function addStep() {
    const after = selected ? stepById(model, selected) : model.steps[model.steps.length - 1];
    const id = 'step' + Date.now();
    const ns_ = { id, name: 'New step', role: after.role || 'am', work: 1, wait: 0, rework: 0, tool: '', x: after.x + 60, y: after.y + 90, next: after.next.map(n => ({ to: n.to, p: n.p })) };
    after.next = [{ to: id, p: 1 }];

  }
  function removeStep(id) {
    if (model.steps.length <= 2 || id === model.entry) { toast('Keep at least the entry step'); return; }
    const s = stepById(model, id); const succ = s.next[0].to;
    for (const o of model.steps) for (const n of o.next) if (n.to === id) n.to = succ;
    for (const o of model.steps) { const m = {}; o.next.forEach(n => m[n.to] = (m[n.to] || 0) + n.p); o.next = Object.keys(m).map(k => ({ to: k, p: m[k] })); }
    model.steps = model.steps.filter(x => x.id !== id); issues = issues.filter(i => i.step !== id);
    selected = null; buildCanvas(); recomputeNow(); renderStep(); toast('Step removed');
  }

      <div class="sugg">${['Hire another strategist', 'Automate the proposal step', 'Add a QA review after onboarding', 'Double the leads', 'What is the bottleneck?', 'Reset'].map(s => `<button class="small" data-s="${s}">${s}</button>`).join('')}</div>
      <div class="note">Tools the real server exposes: <span class="mono">create_process · add_step · set_step_metrics · set_role · run_scenario · compare_scenarios · get_bottlenecks · log_issue · export_report</span></div>`;
    $('chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('chatIn').value.trim(); if (v) handleAI(v); });
    $('pane-ai').querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => handleAI(b.dataset.s)));
    const c = $('chat'); c.scrollTop = c.scrollHeight;
  }
  function handleAI(text) {
    chat.push({ who: 'u', text });
    const q = text.toLowerCase(); let reply, call;
    const roleKey = Object.keys(model.roles).find(r => q.includes(model.roles[r].name.toLowerCase().split(' ')[0]));
    if (/reset|baseline/.test(q)) { resetAll(); reply = 'Reset to the baseline model.'; }
    else if (/hire|add (a|another|one more)|more/.test(q) && roleKey && !/step/.test(q)) { const n = (q.match(/\b(\d+)\b/) || [])[1]; const cnt = n ? parseInt(n) : model.roles[roleKey].count + 1; model = applyPatch(model, [{ path: `roles.${roleKey}.count`, value: cnt }]); call = `set_role({ workspace: "northbeam", role: "${roleKey}", count: ${cnt} })`; recomputeNow(); reply = `Done: ${model.roles[roleKey].name} now ${cnt} FTE. ` + outcomeLine(); }
    else if (/automat|ai[- ]draft/.test(q) && /proposal|audit/.test(q)) { model = applyPatch(model, [{ path: 'steps.audit.work', value: 2 }, { path: 'steps.audit.rework', value: 0.05 }]); call = `set_step_metrics({ workspace: "northbeam", step: "audit", work_hours: 2, rework_rate: 0.05, note: "AI-drafted, strategist reviews" })`; recomputeNow(); reply = 'Set “Audit & proposal” to 2 hours hands-on with 5% rework. ' + outcomeLine(); }
    else if (/automat/.test(q) && /report/.test(q)) { model = applyPatch(model, [{ path: 'roles.am.ongoing', value: 0.7 }]); call = `set_role({ workspace: "northbeam", role: "am", ongoing_hours_per_client_week: 0.7 })`; recomputeNow(); reply = 'Cut AM ongoing reporting load to 0.7 h per client per week. ' + outcomeLine(); }
    else if (/add .*step|add a .* (review|check|step)|insert/.test(q)) {
      const afterName = (q.match(/after (the )?([a-z &]+)/) || [])[2]; const after = afterName ? model.steps.find(s => s.name.toLowerCase().includes(afterName.trim().split(' ')[0])) : stepById(model, 'onboard');
      const nm = (q.match(/add (a |an )?([a-z ]+?) (after|before|step)/) || [])[2] || 'QA review'; const id = 'step' + Date.now();
      const tgt = after || stepById(model, 'onboard');
      model.steps.splice(model.steps.indexOf(tgt) + 1, 0, { id, name: nm.replace(/\b\w/, c => c.toUpperCase()), role: 'am', work: 0.5, wait: 0, rework: 0, tool: '', x: tgt.x + 60, y: tgt.y + 95, next: tgt.next.map(n => ({ to: n.to, p: n.p })) }); tgt.next = [{ to: id, p: 1 }];
      call = `add_step({ workspace: "northbeam", process: "lead-to-live", after: "${tgt.id}", name: "${nm}", role: "am", work_hours: 0.5 })`; selected = id; buildCanvas(); recomputeNow(); reply = `Added “${nm}” after “${tgt.name}”, owned by Account manager at 0.5 h. Open the Step tab to adjust it. ` + outcomeLine();
    }
    else if (/double|leads/.test(q)) { const v = /double/.test(q) ? model.leadsPerWeek * 2 : parseInt((q.match(/\d+/) || [model.leadsPerWeek])[0]); model = applyPatch(model, [{ path: 'leadsPerWeek', value: Math.min(60, v) }]); call = `run_scenario({ workspace: "northbeam", overrides: { leads_per_week: ${Math.min(60, v)} } })`; recomputeNow(); reply = `Leads set to ${model.leadsPerWeek} a week. ` + outcomeLine(); }
    else if (/bottleneck|constraint|stuck/.test(q)) { call = `get_bottlenecks({ workspace: "northbeam", process: "lead-to-live" })`; reply = outcomeLine(true); }
    else reply = 'In the prototype I only understand a few phrasings (hire, automate the proposal, add a step, leads, bottleneck). The real build routes this through Claude with the tool list below.';
    chat.push({ who: 'a', text: reply, call }); renderAI();
  }
  function outcomeLine(full) { const bn = model.roles[res.bnRole]; const u = res.roles[res.bnRole].util; const st = stepById(model, res.bnStep); return `${full ? 'The constraint is' : 'Now:'} ${bn.name} at ${fmt(u * 100)}%, queue at “${st.name}” (${fmt(days(res.steps[res.bnStep].avgWait), 1)} days wait). ${fmt(res.won, 1)} new clients a quarter, ${fmt(days(res.cycleP50))} days lead-to-live.`; }

  // ---------- plumbing ----------
  function recomputeNow() { clearTimeout(pending); res = ProcessSim.simulate(model, 30, 1); renderAll(); }
  function resetAll() { model = keepLayout(baseline); selected = null; recomputeNow(); toast('Back to baseline'); }
  function renderAll() {
    renderKpis(); highlightNodes(); renderUtil(); drawFrame();
    if (tab === 'levers') { renderLevers(); } if (tab === 'compare') renderCompare(); if (tab === 'issues') renderIssues(); if (tab === 'step') renderStep(); if (tab === 'ai') renderAI();
  }
  function showTab(name) { tab = name; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name)); ['levers', 'compare', 'issues', 'step', 'ai'].forEach(p => $('pane-' + p).hidden = p !== name); renderAll(); }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $('btnReset').addEventListener('click', resetAll);
  let toastT; function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }

  buildCanvas(); showTab('levers'); t = 0; drawFrame();
  // start the animation on load so the first frame shows movement
  setTimeout(() => { t = 200; drawFrame(); }, 50);
})();
</script>
